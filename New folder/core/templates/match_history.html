<h2>Match History</h2>
<ul>
  {% for match in matches %}
    <li>
      <a href="{% url 'match_detail' match.id %}">
        {{ match.team1 }} vs {{ match.team2 }}
      </a>
      <form method="post" action="{% url 'delete_match' match.id %}" style="display:inline;">
        {% csrf_token %}
        <button type="submit" onclick="return confirm('Are you sure to delete this match?')">Delete</button>
      </form>
    </li>
  {% endfor %}
</ul>
