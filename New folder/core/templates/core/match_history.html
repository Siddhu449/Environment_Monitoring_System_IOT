<!-- match_history.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Match History</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f5f5f5;
            padding: 20px;
        }
        h1 {
            color: #2a4d69;
        }
        .match-box {
            background-color: white;
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
        }
        .match-box a {
            text-decoration: none;
            color: #2a4d69;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Your Match History</h1>
    {% for match in matches %}
        <div class="match-box">
            <a href="{% url 'match_detail' match.id %}">
                {{ match.team1 }} vs {{ match.team2 }} - {{ match.result }}
            </a>
            <div>Date: {{ match.created_at }}</div>
        </div>
    {% empty %}
        <p>No matches found.</p>
    {% endfor %}

    <br>
    <a href="{% url 'match_setup' %}">Back to Match Setup</a>
</body>
</html>
