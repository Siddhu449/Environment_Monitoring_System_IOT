<!DOCTYPE html>
<html>
<head>
  <title>Confirm Delete</title>
</head>
<body>
  <h2>Are you sure you want to delete the match {{ match.team1 }} vs {{ match.team2 }}?</h2>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Yes, Delete</button>
    <a href="{% url 'match_setup' %}">Cancel</a>
  </form>
</body>
</html>
